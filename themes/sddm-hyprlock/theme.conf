[General]
# --- Background -------------------------------------------------------------
# Written fresh on every greeter start by services.displayManager.sddm.setupScript
# (random pick from ~/Pictures/walls, blurred + dimmed to match hyprlock's
# blur_passes=3 / blur_size=7 / brightness=0.7).
Background=/var/lib/sddm-hyprlock/background.png
# Used if the file above does not exist yet (first boot after the rebuild).
FallbackColor=#11111b

# --- Fonts ------------------------------------------------------------------
Font=JetBrainsMono Nerd Font
ClockFontSize=90
DateFontSize=20
UserFontSize=16

# --- Colors (Catppuccin Mocha, 1:1 with hyprlock.conf) ----------------------
Mauve=#cba6f7
Text=#cdd6f4
Lavender=#b4befe
Red=#f38ba8
Overlay0=#6c7086
Base=#1e1e2e

# --- Input field (hyprlock input-field block) -------------------------------
FieldWidth=280
FieldHeight=50
FieldRounding=12
FieldOutlineThickness=2

# --- Layout: hyprlock `position = 0, N` offsets from screen centre ----------
ClockOffset=160
DateOffset=80
UserOffset=15
FieldOffset=-40

# --- Strings ----------------------------------------------------------------
PlaceholderText=Enter Password
FailText=Wrong
